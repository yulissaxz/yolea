<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rubor Saniye - COSMETIC'S YULISSA</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #fff4f4;
      margin: 0;
      padding: 0;
      color: #5e3a3a;
    }
    .container {
      max-width: 1000px;
      margin: 50px auto;
      padding: 20px;
      background-color: white;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .product {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      align-items: center;
      justify-content: center;
    }
    .product img {
      width: 350px;
      border-radius: 10px;
    }
    .info {
      max-width: 500px;
    }
    .info h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin-bottom: 15px;
    }
    .info p {
      margin: 10px 0;
      font-size: 1.1rem;
    }
    .price {
      font-size: 1.5rem;
      font-weight: bold;
      color: #c96e85;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 25px;
      background-color: #d89aa3;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      transition: background-color 0.3s ease;
      margin-right: 15px;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #ba7b86;
    }
    #carrito {
      margin-top: 30px;
      background-color: #ffe6ec;
      padding: 15px;
      border-radius: 10px;
    }
    footer {
      text-align: center;
      margin-top: 50px;
      padding: 20px;
      background-color: #f8c3c3;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">Inicio 📍</a></li>
      <li><a href="PRODUCTOS.html">Productos 🛒</a></li>
      <li><a href="CONTACTO.html">Contacto ☎️</a></li>
    </ul>
  </nav>
  <div class="container">
    <div class="producto-container">
      <img src="ruborsaniye.jpg" alt="Rubor Saniye">
      <div class="info">
        <h1>Rubor Saniye</h1>
        <p>Rubor compacto de alta pigmentación con textura suave y aterciopelada.</p>
        <p class="price">$45 MXN</p>
        <a href="PRODUCTOS.html" class="btn">← Volver al catálogo</a>
        <button class="btn" onclick="agregarAlCarrito('Rubor Saniye', 45)">Agregar al carrito</button>
        <a href="comprar.html" class="btn">Comprar</a>
      </div>
    </div>

    <div id="carrito">
      <h2>Carrito de compras 🛒</h2>
      <ul id="lista-carrito"></ul>
      <p>Total: $<span id="total">0</span> MXN</p>
      <button class="btn" onclick="vaciarCarrito()">Vaciar carrito</button>
      <button class="btn" onclick="pagar()">Pagar</button>

    </div>
  </div>

  <footer>
    &copy; 2025 COSMETIC'S YULISSA | Belleza mexicana con estilo 💋
  </footer>

  <script>
    let carrito = [];

    function agregarAlCarrito(nombre, precio) {
      carrito.push({ nombre, precio });
      actualizarCarrito();
    }

    function actualizarCarrito() {
      const lista = document.getElementById('lista-carrito');
      const total = document.getElementById('total');
      lista.innerHTML = '';
      let totalPrecio = 0;
      carrito.forEach((item, index) => {
        totalPrecio += item.precio;
        const li = document.createElement('li');
        li.textContent = `${item.nombre} - $${item.precio} MXN`;
        lista.appendChild(li);
      });
      total.textContent = totalPrecio;
    }

    function vaciarCarrito() {
      carrito = [];
      actualizarCarrito();
    }
    function pagar() {
  if (carrito.length === 0) {
    alert("Tu carrito está vacío. Agrega productos antes de pagar.");
  } else {
    // Aquí puedes redirigir a una página de pago real
    window.location.href = "comprar.html"; // o reemplázalo con tu URL real de pago
  }
}

  </script>
</body>
</html>
